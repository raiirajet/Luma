name: Deploy Limba website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage public web files and generate offline preview
        env:
          LIMBA_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.LIMBA_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          LIMBA_WEB_CONFIG_B64: ${{ secrets.LIMBA_WEB_CONFIG_B64 }}
        run: python3 scripts/stage_web.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/web
      - name: Allow uploaded Pages artifact to become available
        run: sleep 8
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
