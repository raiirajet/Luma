name: Deploy Limba website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject optional public Firebase Web configuration
        env:
          LIMBA_WEB_CONFIG_B64: ${{ secrets.LIMBA_WEB_CONFIG_B64 }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib
          payload=os.environ.get('LIMBA_WEB_CONFIG_B64','')
          if payload:
              data=json.loads(base64.b64decode(payload).decode('utf-8'))
              required=('apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId')
              if not all(isinstance(data.get(x),str) and data[x].strip() for x in required):
                  raise SystemExit('Invalid Limba web configuration')
              pathlib.Path('config.js').write_text(
                  'window.LIMBA_FIREBASE_CONFIG='+json.dumps({k:data[k] for k in required})+
                  ';window.LUMA_FIREBASE_CONFIG=window.LIMBA_FIREBASE_CONFIG;\n',
                  encoding='utf-8'
              )
          PY
      - name: Regenerate offline preview from current source
        run: python3 build_preview.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4