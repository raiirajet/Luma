name: Limba web QA

on:
  pull_request:
    branches: [main]
    paths:
      - '*.js'
      - '*.py'
      - '*.html'
      - 'styles.css'
      - 'firebase.json'
      - 'tests/web_security.py'
      - 'assets/**'
      - 'shared/borderless/**'
      - 'android/app/src/main/assets/release-i18n.json'
      - 'scripts/stage_web.py'
      - '.github/workflows/web-qa.yml'
      - 'tests/web_mvp.py'
      - 'tests/*.test.mjs'
      - 'android/app/src/main/assets/brands.json'
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.py'
      - '*.html'
      - 'styles.css'
      - 'firebase.json'
      - 'tests/web_security.py'
      - 'assets/**'
      - 'shared/borderless/**'
      - 'android/app/src/main/assets/release-i18n.json'
      - 'scripts/stage_web.py'
      - '.github/workflows/web-qa.yml'
      - 'tests/web_mvp.py'
      - 'tests/*.test.mjs'
      - 'android/app/src/main/assets/brands.json'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage web files and validate JavaScript syntax
        run: |
          python3 scripts/stage_web.py
          for path in dist/web/*.js; do
            node --input-type=module --check < "$path"
          done
      - name: Check catalogue, search and vehicle experiences
        run: |
          node --experimental-default-type=module tests/model_catalog.test.mjs
          node --experimental-default-type=module tests/lux_experiences.test.mjs
          node --experimental-default-type=module tests/search_filters.test.mjs
      - name: Validate Python source and create preview
        run: |
          python3 -m py_compile build_preview.py scripts/stage_web.py qa_regression.py test_swipe_pointer.py tests/web_mvp.py
          cp dist/web/preview.html preview.html
      - name: Install Playwright and Chromium
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium
      - name: Run desktop and mobile web regression
        run: |
          python3 qa_regression.py
          python3 test_swipe_pointer.py
          python3 tests/web_mvp.py
          python3 tests/web_security.py
