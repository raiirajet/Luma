name: Limba web QA

on:
  pull_request:
    branches: [main]
    paths:
      - '*.js'
      - '*.py'
      - '*.html'
      - 'styles.css'
      - '.github/workflows/web-qa.yml'
      - 'tests/web_mvp.py'
      - 'tests/model_catalog.test.mjs'
      - 'android/app/src/main/assets/brands.json'
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.py'
      - '*.html'
      - 'styles.css'
      - '.github/workflows/web-qa.yml'
      - 'tests/model_catalog.test.mjs'
      - 'android/app/src/main/assets/brands.json'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          for path in app.js cars-i18n.js car-brands.js feature-i18n.js mvp-i18n.js i18n.js translations-extra.js icons.js; do
            node --input-type=module --check < "$path"
          done
          node --check config.js
      - name: Check bundled vehicle model catalogue
        run: node --experimental-default-type=module tests/model_catalog.test.mjs
      - name: Validate Python source and create preview
        run: |
          python3 -m py_compile build_preview.py qa_regression.py test_swipe_pointer.py tests/web_mvp.py
          python3 build_preview.py
          test -s preview.html
      - name: Install Playwright and Chromium
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium
      - name: Run desktop and mobile web regression
        run: |
          python3 qa_regression.py
          python3 test_swipe_pointer.py
          python3 tests/web_mvp.py
