name: Build Limba Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Build debug, build a signed artifact, or publish a signed prerelease
        type: choice
        required: true
        default: debug
        options:
          - debug
          - signed
          - publish

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'debug' && 'release' || 'debug' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'debug' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      artifact: ${{ steps.apk.outputs.artifact }}
      apk: ${{ steps.apk.outputs.apk }}
      version: ${{ steps.apk.outputs.version }}
    steps:
      - name: Require main for a signed build
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'debug' && github.ref != 'refs/heads/main'
        run: |
          echo '::error::Select the main branch for a signed Limba build.'
          exit 1

      - name: Checkout Luma
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 using runner tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Creative Commons Nissan GT-R photograph
        run: |
          # Image by Joshua Spence, CC BY-SA 4.0, Wikimedia Commons.
          # The app includes a clear attribution link in vehicle details.
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 60 \
            'https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/Nissan_GT-R_R35_Black_Edition.JPG/960px-Nissan_GT-R_R35_Black_Edition.JPG' \
            --output android/app/src/main/assets/gtr.jpg || rm -f android/app/src/main/assets/gtr.jpg
          if [ -f android/app/src/main/assets/gtr.jpg ]; then file android/app/src/main/assets/gtr.jpg; fi

      - name: Inject optional Android Firebase configuration
        env:
          LIMBA_ANDROID_CONFIG_B64: ${{ secrets.LIMBA_ANDROID_CONFIG_B64 }}
        run: |
          if [ -n "$LIMBA_ANDROID_CONFIG_B64" ]; then
            printf '%s' "$LIMBA_ANDROID_CONFIG_B64" | base64 -d > android/app/src/main/assets/firebase-config.json
            python3 -m json.tool android/app/src/main/assets/firebase-config.json >/dev/null
          fi

      - name: Test Android and build debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'debug'
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Build APK with the configured release key
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode != 'debug'
        working-directory: android
        env:
          LIMBA_RELEASE_KEYSTORE_B64: ${{ secrets.LIMBA_RELEASE_KEYSTORE_B64 }}
          LIMBA_KEYSTORE_PASSWORD: ${{ secrets.LIMBA_KEYSTORE_PASSWORD }}
          LIMBA_KEY_ALIAS: ${{ secrets.LIMBA_KEY_ALIAS }}
          LIMBA_KEY_PASSWORD: ${{ secrets.LIMBA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in LIMBA_RELEASE_KEYSTORE_B64 LIMBA_KEYSTORE_PASSWORD LIMBA_KEY_ALIAS LIMBA_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Android signing secret $name."
              exit 1
            fi
          done
          umask 077
          LIMBA_KEYSTORE_FILE=$(mktemp "$RUNNER_TEMP/limba-release.XXXXXX.jks")
          export LIMBA_KEYSTORE_FILE
          trap 'unlink "$LIMBA_KEYSTORE_FILE"' EXIT
          printf '%s' "$LIMBA_RELEASE_KEYSTORE_B64" | base64 -d > "$LIMBA_KEYSTORE_FILE"
          unset LIMBA_RELEASE_KEYSTORE_B64
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease

      - name: Verify APK signature and prepare download
        id: apk
        env:
          BUILD_MODE: ${{ inputs.mode || 'debug' }}
          LIMBA_ANDROID_RELEASE_SHA256: ${{ vars.LIMBA_ANDROID_RELEASE_SHA256 }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^[[:space:]]*versionName = "([0-9.]+)"$/\1/p' android/app/build.gradle.kts)
          test -n "$version"
          artifact="Limba-Auto-Android-v$version"
          if [ "$BUILD_MODE" = debug ]; then
            artifact="$artifact-debug"
            source_apk=android/app/build/outputs/apk/debug/app-debug.apk
          else
            source_apk=android/app/build/outputs/apk/release/app-release.apk
          fi
          apk="$artifact.apk"
          mkdir -p apk-output
          cp "$source_apk" "apk-output/$apk"
          cd apk-output
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee "$apk.certificates.txt"
          if [ "$BUILD_MODE" != debug ]; then
            expected=$(printf '%s' "$LIMBA_ANDROID_RELEASE_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
            actual=$(sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: ([a-fA-F0-9]+)$/\1/p' "$apk.certificates.txt" | tr '[:upper:]' '[:lower:]')
            if ! [[ "$expected" =~ ^[a-f0-9]{64}$ ]] || [ "$actual" != "$expected" ] \
              || grep -qi 'CN=Android Debug' "$apk.certificates.txt"; then
              echo '::error::The APK does not match the configured Limba release certificate.'
              exit 1
            fi
          fi
          sha256sum "$apk" | tee "$apk.sha256"
          printf 'artifact=%s\napk=%s\nversion=%s\n' "$artifact" "$apk" "$version" >> "$GITHUB_OUTPUT"

      - name: Upload installable APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: apk-output/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'publish'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.android.outputs.artifact }}
          path: apk-output
      - name: Publish permanently signed APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          APK_FILE: ${{ needs.android.outputs.apk }}
          VERSION: ${{ needs.android.outputs.version }}
        working-directory: apk-output
        run: |
          set -euo pipefail
          sha256sum --check "$APK_FILE.sha256"
          tag="android-v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
            if [ "$release_commit" != "$GITHUB_SHA" ]; then
              echo '::error::This Android version already points to another commit.'
              exit 1
            fi
            gh release upload "$tag" "$APK_FILE" "$APK_FILE.sha256" "$APK_FILE.certificates.txt" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$APK_FILE" "$APK_FILE.sha256" "$APK_FILE.certificates.txt" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Limba Auto Android $VERSION" \
              --notes "Signed Limba Auto Android $VERSION APK, checksum and signing certificate." \
              --prerelease
          fi
