name: Build Luma Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Luma
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 using runner tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Creative Commons Nissan GT-R photograph
        run: |
          # Image by Joshua Spence, CC BY-SA 4.0, Wikimedia Commons.
          # The app includes a clear attribution link in vehicle details.
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 60 \
            'https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/Nissan_GT-R_R35_Black_Edition.JPG/960px-Nissan_GT-R_R35_Black_Edition.JPG' \
            --output android/app/src/main/assets/gtr.jpg || rm -f android/app/src/main/assets/gtr.jpg
          if [ -f android/app/src/main/assets/gtr.jpg ]; then file android/app/src/main/assets/gtr.jpg; fi

      - name: Compile native APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Limba-Auto-Android-v1.3.0.apk
          sha256sum Limba-Auto-Android-v1.3.0.apk

      - name: Upload installable APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Limba-Auto-Android-APK
          path: Limba-Auto-Android-v1.3.0.apk
          retention-days: 30

      - name: Publish APK direct download in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-v1.3.0 >/dev/null 2>&1; then
            gh release create android-v1.3.0 \
              --title 'Limba Auto Android 1.3.0 (native preview)' \
              --notes 'Native Android v1.3: floating plus, first-launch language selection, 14 UI locales, local demo login (limba/demo), on-device test registration, accident status and vehicle condition profile, offline test listings in search and Swipe. Real Firebase authentication and public listing sync are not yet configured. Debug-signed preview: GitHub runner keys may change; reinstall may be necessary.' \
              --prerelease
          fi
          gh release upload android-v1.3.0 Limba-Auto-Android-v1.3.0.apk --clobber