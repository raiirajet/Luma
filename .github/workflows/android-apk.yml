name: Build Limba Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Luma
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 using runner tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Creative Commons Nissan GT-R photograph
        run: |
          # Image by Joshua Spence, CC BY-SA 4.0, Wikimedia Commons.
          # The app includes a clear attribution link in vehicle details.
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 60 \
            'https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/Nissan_GT-R_R35_Black_Edition.JPG/960px-Nissan_GT-R_R35_Black_Edition.JPG' \
            --output android/app/src/main/assets/gtr.jpg || rm -f android/app/src/main/assets/gtr.jpg
          if [ -f android/app/src/main/assets/gtr.jpg ]; then file android/app/src/main/assets/gtr.jpg; fi

      - name: Inject optional Android Firebase configuration
        env:
          LIMBA_ANDROID_CONFIG_B64: ${{ secrets.LIMBA_ANDROID_CONFIG_B64 }}
          LIMBA_RELEASE_KEYSTORE_B64: ${{ secrets.LIMBA_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$LIMBA_ANDROID_CONFIG_B64" ]; then
            printf '%s' "$LIMBA_ANDROID_CONFIG_B64" | base64 -d > android/app/src/main/assets/firebase-config.json
            python3 -m json.tool android/app/src/main/assets/firebase-config.json >/dev/null
          fi
          if [ -n "$LIMBA_RELEASE_KEYSTORE_B64" ] && [ "${{ github.event_name }}" = "push" ]; then
            printf '%s' "$LIMBA_RELEASE_KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/limba-release.jks"
            echo "LIMBA_KEYSTORE_FILE=$GITHUB_WORKSPACE/limba-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Compile native APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Build signed release when signing secrets exist
        if: github.event_name == 'push'
        working-directory: android
        env:
          LIMBA_KEYSTORE_PASSWORD: ${{ secrets.LIMBA_KEYSTORE_PASSWORD }}
          LIMBA_KEY_ALIAS: ${{ secrets.LIMBA_KEY_ALIAS }}
          LIMBA_KEY_PASSWORD: ${{ secrets.LIMBA_KEY_PASSWORD }}
        run: |
          if [ -n "$LIMBA_KEYSTORE_FILE" ] && [ -n "$LIMBA_KEYSTORE_PASSWORD" ] && [ -n "$LIMBA_KEY_ALIAS" ] && [ -n "$LIMBA_KEY_PASSWORD" ]; then
            gradle --no-daemon --stacktrace :app:assembleRelease
          fi

      - name: Prepare download
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk Limba-Auto-Android-v1.4.0.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk Limba-Auto-Android-v1.4.0.apk
          fi
          sha256sum Limba-Auto-Android-v1.4.0.apk

      - name: Upload installable APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Limba-Auto-Android-APK
          path: Limba-Auto-Android-v1.4.0.apk
          retention-days: 30

      - name: Publish APK direct download in GitHub Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-v1.4.0 >/dev/null 2>&1; then
            gh release create android-v1.4.0 \
              --title 'Limba Auto Android 1.4.0 (Firebase-ready)' \
              --notes 'Limba 1.4 Firebase-ready preview. Offline demo stays available. Real auth, public listings and photos require Firebase configuration and deployed rules. Without release signing secrets the downloadable APK remains debug-signed and is not a production release.' \
              --prerelease
          fi
          gh release upload android-v1.4.0 Limba-Auto-Android-v1.4.0.apk --clobber