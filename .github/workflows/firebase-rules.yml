name: Limba Firebase rules validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'firebase.json'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - 'functions/**'
      - '.github/workflows/firebase-rules.yml'
      - 'tests/firebase_rules.test.mjs'
  push:
    branches: [main]
    paths:
      - 'firebase.json'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - 'functions/**'
      - '.github/workflows/firebase-rules.yml'
      - 'tests/firebase_rules.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase rules and Cloud Functions test dependencies
        run: |
          npm ci --prefix functions
          npm install --no-save firebase@12.6.0 @firebase/rules-unit-testing@5.0.0
      - name: Start emulators and verify access-control rules and Cloud Functions
        run: npx -y firebase-tools@latest emulators:exec --project demo-limba --only firestore,storage "node tests/firebase_rules.test.mjs && npm test --prefix functions"

      - name: Deploy validated Firestore rules when production credentials exist
        if: github.event_name == 'push'
        env:
          LIMBA_FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.LIMBA_FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: |
          if [ -z "$LIMBA_FIREBASE_SERVICE_ACCOUNT_B64" ]; then
            echo "::warning::Firestore rules were validated but NOT deployed: configure LIMBA_FIREBASE_SERVICE_ACCOUNT_B64 to enable deployment."
            exit 0
          fi
          printf '%s' "$LIMBA_FIREBASE_SERVICE_ACCOUNT_B64" | base64 -d > "$RUNNER_TEMP/limba-firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/limba-firebase-service-account.json"
          npx -y firebase-tools@latest deploy --project limba-auto --only firestore:rules --non-interactive
