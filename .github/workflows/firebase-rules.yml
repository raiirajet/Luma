name: Limba Firebase rules validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'firebase.json'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - 'functions/**'
      - '.github/workflows/firebase-rules.yml'
      - 'tests/firebase_rules.test.mjs'
  push:
    branches: [main]
    paths:
      - 'firebase.json'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - 'functions/**'
      - '.github/workflows/firebase-rules.yml'
      - 'tests/firebase_rules.test.mjs'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Firebase rules and Cloud Functions test dependencies
        run: |
          npm ci --prefix functions
          npm install --no-save firebase@12.6.0 @firebase/rules-unit-testing@5.0.0
      - name: Start emulators and verify access-control rules and Cloud Functions
        run: npx -y firebase-tools@15.37.0 emulators:exec --project demo-limba --only firestore,storage "node tests/firebase_rules.test.mjs && npm test --prefix functions"
