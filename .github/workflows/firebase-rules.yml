name: Limba Firebase rules validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'firebase.json'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - '.github/workflows/firebase-rules.yml'
  push:
    branches: [main]
    paths:
      - 'firebase.json'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - '.github/workflows/firebase-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Start emulators and parse rules
        run: firebase emulators:exec --project demo-limba --only firestore,storage "echo Limba_Firebase_rules_valid"
